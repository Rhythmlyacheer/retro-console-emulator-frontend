[project]
name = "retro-console-emulator-frontend"
version = "2026.3.0"
description = "Windows desktop frontend for libretro cores — NES, SNES, Genesis, GB/GBA, PSX, arcade."
requires-python = ">=3.12"
readme = "CONTRIBUTING.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "retro-frontend maintainers" }]
dependencies = [
    "PySide6>=6.7",
    "tomli-w>=1.0",
    "platformdirs>=4.2",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "black>=24.4", "mypy>=1.10"]

[project.scripts]
retro-frontend = "retro_frontend.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
files = ["retro_frontend/core", "retro_frontend/models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"